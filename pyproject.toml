[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dikw-data"
version = "0.1.0"
description = "Synthetic evaluation data factory for dikw-core."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "openai>=2.32",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src", "."]
