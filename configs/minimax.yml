provider:
  llm: anthropic_compat
  llm_model: MiniMax-M3
  llm_base_url: https://api.minimaxi.com/anthropic
  llm_api_key_env: MINIMAX_API_KEY
  timeout_seconds: 120
  sdk_max_retries: 2

retry_policy:
  max_attempts: 6
  initial_backoff_seconds: 2
  max_backoff_seconds: 60
  jitter: true
  timeout_seconds: 120

runtime:
  concurrency: 2
  rate_limit_slowdown_after: 3

